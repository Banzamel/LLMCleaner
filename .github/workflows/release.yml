name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check PowerShell syntax
        shell: powershell
        run: |
          $bad = 0
          foreach ($f in Get-ChildItem -Recurse -Filter *.ps1) {
            $tokens = $null; $errors = $null
            [void][Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$tokens, [ref]$errors)
            foreach ($e in $errors) { Write-Host "::error file=$($f.Name),line=$($e.Extent.StartLineNumber)::$($e.Message)"; $bad++ }
            $bom = [IO.File]::ReadAllBytes($f.FullName)[0..2] -join ','
            if ($bom -ne '239,187,191') { Write-Host "::error file=$($f.Name)::File must be saved as UTF-8 with BOM (Windows PowerShell 5.1)"; $bad++ }
          }
          if ($bad) { exit 1 }

      - name: Determine version
        id: version
        shell: powershell
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $v = $env:GITHUB_REF_NAME.TrimStart('v')
            $inScript = [regex]::Match((Get-Content LLMCleaner.ps1 -Raw), "\`$Version = '([^']+)'").Groups[1].Value
            if ($inScript -ne $v) { Write-Host "::error::Tag v$v does not match `$Version = '$inScript' in LLMCleaner.ps1"; exit 1 }
          } else {
            $v = '0.0.0-dev'
          }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: powershell
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=${{ steps.version.outputs.version }}" installer\LLMCleaner.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build portable zip
        shell: powershell
        run: |
          $v = '${{ steps.version.outputs.version }}'
          $tmp = "portable\LLMCleaner"
          New-Item -ItemType Directory -Force $tmp | Out-Null
          Copy-Item LLMCleaner.ps1, LLMCleaner.bat, LLMCleaner.ico, README.md, LICENSE, installer\Install-AI.ps1 $tmp
          Copy-Item lib, lang $tmp -Recurse
          Compress-Archive -Path $tmp -DestinationPath "dist\LLMCleaner-$v-portable.zip"
          Get-ChildItem dist | ForEach-Object { "{0}  {1:N0} KB" -f $_.Name, ($_.Length / 1KB) }

      - name: Extract release notes
        if: github.ref_type == 'tag'
        shell: powershell
        run: |
          $v = [version]'${{ steps.version.outputs.version }}'
          # Versions that were never released get their notes in this release too
          $prev = git tag --list 'v*' | ForEach-Object { [version]$_.TrimStart('v') } | Where-Object { $_ -lt $v } |
            Sort-Object -Descending | Select-Object -First 1
          $log = [IO.File]::ReadAllText('CHANGELOG.md')
          $sections = [regex]::Matches($log, "(?ms)^## (\d+\.\d+\.\d+)\b[^\r\n]*\r?\n(.*?)(?=^## |\z)") |
            Where-Object { $sv = [version]$_.Groups[1].Value; $sv -le $v -and (-not $prev -or $sv -gt $prev) }
          if (-not ($sections | Where-Object { [version]$_.Groups[1].Value -eq $v })) { Write-Host "::error::CHANGELOG.md has no section for $v"; exit 1 }
          if (@($sections).Count -eq 1) { $notes = @($sections)[0].Groups[2].Value.Trim() }
          else { $notes = (@($sections) | ForEach-Object { $_.Value.Trim() }) -join "`n`n" }
          [IO.File]::WriteAllText("$pwd\release-notes.md", $notes)

      - uses: actions/upload-artifact@v4
        with:
          name: LLMCleaner-${{ steps.version.outputs.version }}
          path: dist/*

      - name: Publish GitHub release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          name: LLMCleaner ${{ steps.version.outputs.version }}
          body_path: release-notes.md
          files: dist/*
